<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Винная карта</title>
  <meta name="description" content="Актуальная винная карта: вина по бокалам и бутылкам, дижестивы и пиво.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='white'/%3E%3Cpath d='M12 12h40v8H12zm12 9h16v20a8 8 0 0 1-16 0z' fill='%23e43338'/%3E%3Cpath d='M32 48v10m-12 0h24' stroke='%231c1c1c' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#fff;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button{font:inherit}main{width:min(100%,810px);margin:auto;padding:55px 42px 110px}.sheet{padding:0 0 56px;margin:0 0 56px;border-bottom:1px solid #eee}.sheet:last-child{border:0}.section{margin:0 0 31px}.section-header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:0 0 13px}.section h2,.section h3{font-size:15px;line-height:1.1;margin:0;font-weight:800;color:#df1e26;text-transform:uppercase}.volume{font-size:12px;color:#a58e72;white-space:nowrap}.subhead{color:#a99276;font-weight:700;font-size:13px;margin:18px 0 7px}.wine{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;width:100%;padding:4px 0 5px;text-align:left;background:none;border:0;cursor:pointer;color:inherit}.wine:not(.wine-static):hover .name,.wine:focus-visible .name{text-decoration:underline;text-decoration-color:#df1e26;text-underline-offset:2px}.wine-static{cursor:default}.wine:focus-visible{outline:2px solid #df1e26;outline-offset:3px}.name{display:block;font-size:14px;line-height:1.16;font-weight:700}.origin{display:block;margin-top:2px;font-size:11.5px;line-height:1.16;color:#777}.price{font-size:12px;color:#998e82;padding-top:1px;white-space:nowrap}.page-no{text-align:center;color:#c7bdb1;font-size:11px;margin-top:15px}dialog{border:0;padding:0;max-width:min(720px,100vw);width:100%;max-height:100dvh;box-shadow:0 22px 90px #0004}dialog::backdrop{background:#0008}.detail{padding:26px 34px 40px;max-height:100dvh;overflow:auto}.detail-top{position:sticky;top:-26px;z-index:2;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;margin-bottom:26px;padding:12px 0 16px}.detail-top span{font-size:14px;font-weight:700}.close{border:0;background:transparent;font-size:29px;line-height:1;cursor:pointer;padding:0 3px}.detail h1{font-size:27px;line-height:1.18;margin:0 0 20px}.detail img{display:block;width:min(100%,440px);height:auto;margin:0 auto 28px}.bar{background:#ed423d;color:#fff;padding:9px 13px;margin:26px 0 15px;border-radius:3px;font-size:16px}.detail p,.detail li{font-size:16px;line-height:1.48;color:#454545}.detail p{margin:0 0 16px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;font-size:14px}.facts div{border-bottom:1px solid #eee;padding-bottom:8px}.facts b{display:block;margin-bottom:4px}.taste{border-radius:8px;background:#eee;padding:14px 16px;display:grid;grid-template-columns:100px 1fr;gap:7px 12px;max-width:360px}.dots{color:#bf0012;letter-spacing:3px}.muted{color:#c3c3c3}.source-note{padding:12px 15px;background:#fff2f2;border-left:3px solid #df1e26;font-size:13px!important}.legal{width:min(100%,810px);margin:auto;padding:0 42px 60px;font-size:12px;line-height:1.45;color:#555}.simple-note{padding:18px 0;color:#666;font-size:15px}.detail ul{padding-left:22px}.detail li{padding-bottom:6px}@media(max-width:600px){main{padding:32px 25px 70px}.sheet{margin-bottom:39px;padding-bottom:31px}.section{margin-bottom:27px}.name{font-size:14px}.origin{font-size:11.5px}.detail{padding:20px 23px 35px}.detail-top{top:-20px}.detail h1{font-size:23px}.facts{grid-template-columns:1fr}dialog{height:100dvh}}
  </style>
</head>
<body>
<main id="map" aria-label="Винная карта"></main><footer class="legal">Продажа алкогольной продукции несовершеннолетним запрещена законом.<br>Цены в меню указаны в рублях.</footer>
<dialog id="wine-dialog" aria-labelledby="detail-title"><div class="detail"><div class="detail-top"><span id="detail-section">Винная карта</span><button class="close" type="button" aria-label="Закрыть">×</button></div><div id="detail-content"></div></div></dialog>
<script src="wine-details.js"></script>
<script src="menu-data.js"></script>
<script>
// Each sheet follows the corresponding column in the supplied printed menu.
const sheets = window.menuSheets;
const detailedIds=new Set(window.wineDetails.map(w=>w.id));
const map=document.getElementById('map'), dialog=document.getElementById('wine-dialog');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let wines=[];
map.innerHTML=sheets.map((sheet,pi)=>`<div class="sheet">${sheet.map(([heading,volume,groups])=>`<section class="section"><div class="section-header"><h2>${escapeHtml(heading)}</h2><span class="volume">${escapeHtml(volume)}</span></div>${groups.map(([sub,items])=>`${sub?`<div class="subhead">${escapeHtml(sub)}</div>`:''}${items.map(item=>{let id=wines.push({item,section:heading,sub,volume})-1;const hasDetail=item[3]==='universo'||detailedIds.has(item[3]);const tag=hasDetail?'button':'div';return `<${tag} class="wine${hasDetail?'':' wine-static'}" ${hasDetail?`type="button" data-id="${id}" aria-label="${escapeHtml(item[0])}, ${escapeHtml(item[2])} рублей"`:``}><span><span class="name">${escapeHtml(item[0])}</span>${item[1]?`<span class="origin">${escapeHtml(item[1])}</span>`:''}</span><span class="price">${escapeHtml(item[2])}</span></${tag}>`}).join('')}`).join('')}</section>`).join('')}<div class="page-no">${pi+1}</div></div>`).join('');
const detail=document.getElementById('detail-content');
const special=window.wineDetails;
const renderDetail=(e,menuName)=>{
 if(e.paragraphs){
  const heading=/^(Дегустационные заметки|Вкус|Аромат|Гастрономические сочетания|Гастрономическое сочетание|О производителе|Интересные факты|Описание|Характеристики):?$/i;
  const paragraphs=e.paragraphs.slice(1).filter(p=>p.trim()&&!/^(Дегустационные характеристики|Дегустационные заметки|Дегустационный заметки):?$/i.test(p.trim()));
  const normalized=s=>s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zа-яё0-9]/gi,'');
  const titleKeys=new Set([normalized(e.name),normalized(menuName)]);
  while(paragraphs.length&&titleKeys.has(normalized(paragraphs[0])))paragraphs.shift();
  return `<h1 id="detail-title">${escapeHtml(menuName)}</h1><img class="bottle" src="${escapeHtml(e.image)}" alt="Бутылка ${escapeHtml(menuName)}">${paragraphs.map(p=>{let t=p.trim();return heading.test(t)?`<div class="bar">${escapeHtml(t)}</div>`:`<p>${escapeHtml(t).replaceAll('\n','<br>')}</p>`}).join('')}`;
 }
 return `<h1 id="detail-title">${escapeHtml(e.name)}</h1><p>${escapeHtml(e.subtitle)}</p>${e.image?`<img class="bottle" src="${escapeHtml(e.image)}" alt="Бутылка ${escapeHtml(e.name)}">`:``}<div class="bar">Характеристики</div><div class="facts"><div><b>Категория</b>${escapeHtml(e.kind)}</div><div><b>Регион</b>${escapeHtml(e.region)}</div><div><b>Производитель</b>${escapeHtml(e.producer)}</div><div><b>Виноград</b>${escapeHtml(e.grapes)}</div><div><b>Крепость</b>${escapeHtml(e.strength)}</div><div><b>Объём</b>${escapeHtml(e.volume)}</div></div><div class="bar">Вкус</div><p>${escapeHtml(e.taste)}</p><div class="bar">Аромат</div><p>${escapeHtml(e.aroma)}</p><div class="bar">Гастрономические сочетания</div><p>${escapeHtml(e.pairing)}</p><div class="bar">${e.id==='ballet'||e.id==='merlot'?'Описание':'О производителе'}</div>${e.story.map(x=>`<p>${escapeHtml(x)}</p>`).join('')}`;
};
map.addEventListener('click',event=>{const button=event.target.closest('.wine');if(!button)return;let w=wines[Number(button.dataset.id)];document.getElementById('detail-section').textContent=w.section==='Вино по бокалам'?'Вино по бокалам':w.section==='Вино Special'?'Вино Special':'Винная карта';if(w.item[3]&&w.item[3]!=='universo'){const e=special.find(x=>x.id===w.item[3]);if(e){detail.innerHTML=renderDetail(e,w.item[0]);dialog.showModal();return}}if(w.item[3]==='universo'){detail.innerHTML=`<h1 id="detail-title">Prosecco Universo di Corvezzo<br><small>(Просекко Универсо ди Корвеццо)</small></h1><img src="assets/universo.jpg" alt="Бутылка Prosecco Universo di Corvezzo и бокал"><div class="bar">Вкусное описание</div><p>Это не обычное просекко, ведь мы (команда «Кофемании») сами создали это игристое совместно с семейной винодельней Корвеццо в Италии.</p><p>Простое, на первый взгляд, вино мы сделали совершенным, создав невероятно свежий, лёгкий и фруктовый вкус, обладающий при этом сдержанной строгостью и минеральностью.</p><div class="bar">Характеристики</div><div class="facts"><div><b>Страна, регион</b>Италия, Венето</div><div><b>Производитель</b>Corvezzo</div><div><b>Виноград</b>Глера 100%</div><div><b>Сахар</b>Брют (6 г/л)</div><div><b>Крепость</b>11,5%</div><div><b>Объём</b>0,75 л</div></div><div class="bar">Вкус</div><div class="taste"><span>Сладость</span><span class="dots">●<span class="muted">○○○○○</span></span><span>Кислотность</span><span class="dots">●●●<span class="muted">○○○</span></span><span>Тело</span><span class="dots">●●<span class="muted">○○○○</span></span></div><div class="bar">Сторителлинг</div><p>Это просекко, про которое хочется рассказывать и рассказывать, но истине является нашей гордостью. Несколько лет назад мы решили создать особенное игристое, опираясь на вкусы наших гостей, и сделали это совместно с компанией Винотерра и итальянской семейной винодельней Корвеццо. После долгих обсуждений мы приехали в Италию, где, перепробовав огромное количество базовых вин, нашли то сочетание вкуса, которое искали.</p><p>Уникальность Prosecco Universo в том, что здесь впервые объединён виноград из двух лучших винодельческих зон региона Венето — Вальдоббьядене (80%) и Азоло (20%). Благодаря этому вкусу получился одновременно лёгким и глубоким: виноград из Вальдоббьядене делает его свежим и фруктовым, а виноград из Азоло добавляет приятную строгость и минеральность с тонкими травянистыми нотками.</p><p>Обе зоны имеют статус DOCG — высшую ступень в итальянской классификации. Обозначение относится к зонам, где выращен виноград, хотя виноград собран с лучших участков региона.</p><p>Этикетку для нас вручную выполнила акварелью художница Ася Вейгерт. Она вдохновлялась красивой игрой пузырьков нашего просекко и увидела в изображении бокала целую вселенную.</p><div class="bar">Отличные сочетания</div><p>Идеально в качестве аперитива, с закусками и лёгкими блюдами из морепродуктов.</p><p><b>Пэйринги:</b></p><ul><li>Блин с лососем</li><li>Лосось с драниками</li><li>Греко салат</li><li>Хумус с запечённым томатом</li><li>Котлета по-киевски</li></ul>`}else{detail.innerHTML=`<h1 id="detail-title">${escapeHtml(w.item[0])}</h1><p>${escapeHtml(w.item[1]||w.sub||w.section)}</p><p class="source-note">Описание и фотография для этой позиции отсутствуют в предоставленных файлах Word.</p><div class="bar">В карте</div><div class="facts"><div><b>Раздел</b>${escapeHtml(w.section)}${w.sub?` · ${escapeHtml(w.sub)}`:''}</div><div><b>Объём</b>${escapeHtml(w.volume||w.sub.match(/\d+\s*мл/)?.[0]||w.section.match(/\d+\s*мл/)?.[0]||'750 мл')}</div><div><b>Цена</b>${escapeHtml(w.item[2])} ₽</div></div>`}dialog.showModal()});
document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script>
</body>
</html>
